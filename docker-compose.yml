services:
  postgres:
    image: postgres:15-alpine
    container_name: coworkify_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coworkify_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: coworkify_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: coworkify_worker
    restart: always
    # -Q celery: this worker only ever consumes the default queue. agent_step
    # tasks (the only ones needing codoctopus + LLM SDKs) go to worker-agent
    # below instead, so this image and its dependency footprint stay untouched.
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=4 -Q celery
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Dedicated worker for the agent_step task type — the only one that needs
  # codoctopus and an LLM SDK installed. Kept as its own image/queue so the
  # `worker` service above never needs those dependencies. Opt-in via
  # `docker compose --profile agent up`, since it needs CODOCTOPUS_PATH (a
  # local Codoctopus checkout) and an LLM provider's credentials to be useful.
  worker-agent:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: Dockerfile.agent
      additional_contexts:
        codoctopus: ${CODOCTOPUS_PATH:-./.codoctopus-path-not-set}
    container_name: coworkify_worker_agent
    restart: always
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2 -Q agent_step -n agent_worker@%h
    volumes:
      - .:/app
      - ${CODOCTOPUS_PATH:-./.codoctopus-path-not-set}:/codoctopus
    # Any provider credentials the LLM SDKs read from the environment
    # (ANTHROPIC_API_KEY, OPENAI_API_KEY, OPENAI_BASE_URL for an
    # OpenAI-compatible local server, ...) — put them in .env and they reach
    # this worker without needing to be named here one by one.
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - AGENT_STEP_DEFAULT_MODEL=${AGENT_STEP_DEFAULT_MODEL:-anthropic:claude-opus-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: coworkify_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    
  beat:
    build: .
    container_name: coworkify_beat
    restart: always
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  postgres_data:
  redis_data:

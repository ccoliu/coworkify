# Place at: coworkify/.github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 每週一次改測 Codoctopus 的 main（見下方 Check out Codoctopus），提早發現上游的破壞性改動
  schedule:
    - cron: '0 3 * * 1' # 每週一早上 3 點（UTC）
  workflow_dispatch:
    inputs:
      codoctopus_ref:
        description: "要測的 Codoctopus ref（branch / tag / SHA）；留空用 CODOCTOPUS_REF"
        required: false
        default: ""

permissions:
  contents: read

env:
  # 測試用的 Codoctopus 版本。升級就改這一行，在它自己的 commit 裡讓 CI 跑一次。
  # 本機 worker-agent 用的是 CODOCTOPUS_PATH 那份 checkout，要對齊就
  #   git -C <codoctopus 目錄> checkout <這個 SHA>
  CODOCTOPUS_REF: 2a7868b68368836212113fc1014021c9735224a5

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # executor 整合測試會連這台 Postgres（上面的 service），另建 ci_test 資料庫；
      # Redis 仍只是佔位——executor 在 import 時建立 client，但測試把推播換掉了，不會真的連線
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      # agent_step depends on codoctopus, which is not on PyPI yet.
      # 平常一律用上面釘住的 CODOCTOPUS_REF，同一個 Coworkify commit 重跑結果才會一樣；
      # 每週排程改測 main，上游壞掉只會讓那一次排程變紅，不會擋到 PR；手動觸發可以指定任一個 ref。
      - name: Check out Codoctopus
        uses: actions/checkout@v4
        with:
          repository: ccoliu/Codoctopus
          ref: ${{ github.event_name == 'schedule' && 'main' || inputs.codoctopus_ref || env.CODOCTOPUS_REF}}
          path: codoctopus-src

      - name: Show Codoctopus version
        run: git -C codoctopus-src log -1 --format='Codoctopus %H %s'

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pytest-cov
          pip install -e "./codoctopus-src[anthropic]"

      - name: Run tests with coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml

  frontend-build:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

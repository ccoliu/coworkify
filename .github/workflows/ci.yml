# Place at: coworkify/.github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 每週一次改測 Codoctopus 的 main（見下方 Check out Codoctopus），提早發現上游的破壞性改動
  schedule:
    - cron: '0 3 * * 1' # 每週一早上 3 點（UTC）
  workflow_dispatch:
    inputs:
      codoctopus_ref:
        description: "要測的 Codoctopus ref（branch / tag / SHA）；留空用 CODOCTOPUS_REF"
        required: false
        default: ""

permissions:
  contents: read

env:
  # 測試用的 Codoctopus 版本。升級就改這一行，在它自己的 commit 裡讓 CI 跑一次。
  # 本機 worker-agent 用的是 CODOCTOPUS_PATH 那份 checkout，要對齊就
  #   git -C <codoctopus 目錄> checkout <這個 SHA>
  CODOCTOPUS_REF: 2a7868b68368836212113fc1014021c9735224a5

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # executor 整合測試會連這台 Postgres（上面的 service），另建 ci_test 資料庫；
      # Redis 仍只是佔位——executor 在 import 時建立 client，但測試把推播換掉了，不會真的連線
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      # agent_step depends on codoctopus, which is not on PyPI yet.
      # 平常一律用上面釘住的 CODOCTOPUS_REF，同一個 Coworkify commit 重跑結果才會一樣；
      # 每週排程改測 main，上游壞掉只會讓那一次排程變紅，不會擋到 PR；手動觸發可以指定任一個 ref。
      - name: Check out Codoctopus
        uses: actions/checkout@v4
        with:
          repository: ccoliu/Codoctopus
          ref: ${{ github.event_name == 'schedule' && 'main' || inputs.codoctopus_ref || env.CODOCTOPUS_REF}}
          path: codoctopus-src

      - name: Show Codoctopus version
        run: git -C codoctopus-src log -1 --format='Codoctopus %H %s'

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pytest-cov
          pip install -e "./codoctopus-src[anthropic]"

      - name: Run tests with coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml --junitxml=junit.xml --cov-fail-under=75

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml

  e2e:
    # 其他 job 都把 Celery 和 Redis 換掉了；這個 job 起真的 API、worker 和 Redis，
    # 從外面用 HTTP / WebSocket 打。跟單元測試分開跑，PR 的快速回饋不會被它拖慢。
    name: End-to-end (API + Celery worker + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-jwt-secret
      E2E_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@4

      - uses: actions/setup-python@5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # 不裝 Codoctopus：這裡的 workflow 沒有 agent_step，worker 也只吃預設的 celery queue
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      
      - name: Start the API and a Celery worker
        run: |
          uvicorn app.main:app --port:8000 > api.log 2>&1 &
          # worker 用 root 跑，跟正式環境的容器一樣。sandbox 把子程序的 RLIMIT_NPROC 設成 32，
          # 這個上限算的是「同一個使用者的所有 process 與 thread」，而且只對非 root 生效——
          # runner 使用者光是 runner 本身就有幾十個 thread，shell 步驟裡的 $(...) 會 fork 失敗。
          sudo -E env "PATH=$PATH" celery -A app.celery_app.celery_app worker -Q celery --concurrency=2 --loglevel=info > worker.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf localhost:8000/health && exit 0
            sleep 1
          done
          echo "API did not come up"; cat api.log; exit 1

      - name: Run end-to-end tests
        run: pytest tests/e2e -q -rs

      - name: Show API and worker logs
        if: failure()
        run: |
          echo "::group::api.log"; cat api.log; echo "::endgroup::"
          echo "::group::worker.log"; cat worker.log; echo "::endgroup::"

  frontend-build:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

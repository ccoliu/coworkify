# Place at: coworkify/.github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # executor 整合測試會連這台 Postgres（上面的 service），另建 ci_test 資料庫；
      # Redis 仍只是佔位——executor 在 import 時建立 client，但測試把推播換掉了，不會真的連線
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      # agent_step depends on codoctopus, which is not on PyPI yet.
      - name: Check out Codoctopus
        uses: actions/checkout@v4
        with:
          repository: ccoliu/Codoctopus
          path: codoctopus-src

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pytest-cov
          pip install -e "./codoctopus-src[anthropic]"

      - name: Run tests with coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml

  frontend-build:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
